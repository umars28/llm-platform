[project]
name = "llm-gateway"
version = "0.1.0"
description = "A gateway for LLM traffic: per-tenant quota, provider failover, cost attribution and SLO metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "redis>=5.2",
]

[project.scripts]
llm-gateway = "llm_gateway.main:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
