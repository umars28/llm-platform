[project]
name = "pr-reviewer"
version = "0.1.0"
description = "An LLM code reviewer with a measured recall and false-positive rate, evaluated against real defects taken from real git history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Sabirin" }]
dependencies = ["anthropic>=1.6", "pyyaml>=6.0"]

[project.scripts]
pr-reviewer = "pr_reviewer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a model, local or hosted"]
