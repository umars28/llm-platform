[project]
name = "llm-tracing"
version = "0.1.0"
description = "OpenTelemetry tracing for LLM applications: spans that survive a crash, redact secrets before export, and carry the token and cost attributes an LLM trace is read for."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Sabirin" }]
dependencies = []

[project.scripts]
llm-tracing = "llm_tracing.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
otlp = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tracing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
