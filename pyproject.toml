[project]
name = "runbook-rag"
version = "0.1.0"
description = "A measured retrieval pipeline over real operational documentation: chunking, embedding, hybrid search and reranking, scored against a labelled query set."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Sabirin" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
runbook-rag = "runbook_rag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runbook_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the embedding or reranking model loaded"]
