[project]
name = "ops-copilot"
version = "0.1.0"
description = "An MCP server and agent that diagnoses production incidents and proposes remediations behind a human approval gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Sabirin" }]
dependencies = [
    "anthropic[mcp]>=0.75.0",
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
ops-copilot = "ops_copilot.cli:main"
ops-copilot-server = "ops_copilot.server:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
