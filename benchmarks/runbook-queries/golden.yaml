# Golden query set.
#
# Queries are written the way an engineer under pressure types them: a symptom,
# an error string, a half-remembered flag. They are deliberately NOT phrased as
# the document titles they should match, because a retriever that only works
# when the query already uses the document's vocabulary has not solved anything.
#
# Grades are graded relevance, which is what nDCG needs:
#   2 = answers the question directly; an engineer would stop reading here
#   1 = genuinely useful supporting context, but not the answer on its own
#
# Paths are relative to content/en/docs/ in kubernetes/website. Every path is
# validated against the ingested corpus by tests/test_golden.py, so a typo or a
# page that moved upstream fails the suite instead of silently scoring zero.

