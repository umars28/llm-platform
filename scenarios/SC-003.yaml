id: SC-003
title: Webhook dispatcher stops accepting connections from leaked file descriptors
category: resource-exhaustion
alert:
  name: WebhookDispatcherErrors
  severity: P2
  service: webhook-dispatcher
  fired_at: "2026-09-13T08:05:00Z"
  description: >-
    webhook-dispatcher is returning connection errors on 38% of outbound
    deliveries. Customer webhook backlog is growing at 4000 events/minute.
world:
  services:
    - {name: webhook-dispatcher, tier: 2, owner: integrations, depends_on: [event-queue]}
    - {name: event-queue, tier: 1, owner: platform-team, depends_on: []}
  deploys:
    - t: -1440
      service: webhook-dispatcher
      version: v3.8.0
      commit: 55ab901
      author: yuki.n
      summary: "Switch outbound HTTP client to per-request session for custom TLS pinning"
  logs:
    webhook-dispatcher:
      - {t: -600, level: WARN, msg: "socket: too many open files (fd_count=7200)", count: 3}
      - {t: -180, level: WARN, msg: "socket: too many open files (fd_count=59800)", count: 210}
      - {t: -40, level: ERROR, msg: "OSError: [Errno 24] Too many open files", count: 1840}
      - {t: -10, level: ERROR, msg: "delivery failed: cannot create connection (target=customer endpoint)", count: 3900}
    event-queue:
      - {t: -60, level: INFO, msg: "consumer lag for group webhook-dispatcher: 184000 messages"}
      - {t: -5, level: INFO, msg: "consumer lag for group webhook-dispatcher: 402000 messages"}
  metrics:
    webhook-dispatcher:
      open_file_descriptors:
        unit: fds
        points: [{t: -1440, v: 410}, {t: -720, v: 21000}, {t: -360, v: 44000}, {t: -120, v: 61000}, {t: 0, v: 65530}]
      fd_limit:
        unit: fds
        points: [{t: -1440, v: 65536}, {t: 0, v: 65536}]
      delivery_error_rate:
        unit: percent
        points: [{t: -1440, v: 0.3}, {t: -360, v: 1.1}, {t: -60, v: 18}, {t: 0, v: 38}]
      container_memory_working_set_bytes:
        unit: MiB
        points: [{t: -1440, v: 340}, {t: 0, v: 396}]
      cpu_utilisation:
        unit: percent
        points: [{t: -1440, v: 18}, {t: 0, v: 21}]
      pod_restarts_total:
        unit: restarts
        points: [{t: -1440, v: 0}, {t: 0, v: 0}]
  k8s:
    - kind: Deployment
      name: webhook-dispatcher
      namespace: prod
      spec:
        replicas: 4
        image: "registry.internal/webhook-dispatcher:v3.8.0"
        resources:
          requests: {cpu: "500m", memory: "512Mi"}
          limits: {cpu: "1", memory: "1Gi"}
      status: {readyReplicas: 4, restarts_last_hour: 0}
      events: []
  runbooks:
    - id: RB-031
      title: "File descriptor exhaustion"
      tags: [fd, sockets, file-descriptors, leak, connections, errno24]
      body: >-
        "Too many open files" means the process hit its fd limit. Compare
        open_file_descriptors against fd_limit and check the slope. A sawtooth
        that resets on restart with a rising floor is a leak -- most often HTTP
        client sessions or sockets created per request and never closed. A
        restart clears it temporarily and is an acceptable stop-gap, but the
        leak returns on the same slope; fix or revert the code that creates the
        connections.
ground_truth:
  root_cause: >-
    webhook-dispatcher v3.8.0 creates a new HTTP client session per outbound
    request for TLS pinning and never closes it, leaking one socket per
    delivery. File descriptors climbed steadily from 410 to the 65536 limit over
    roughly a day, after which no new connection could be opened and deliveries
    began failing. Memory, CPU and restart count are all normal, so this is
    descriptor exhaustion specifically rather than general resource pressure.
  must_include:
    - ["file descriptor", "fd", "socket", "open files"]
    - ["leak", "never closed", "not closed", "per-request session", "per request"]
    - ["v3.8.0", "limit", "65536", "exhaust"]
  must_not_include:
    - ["event-queue is down", "memory leak", "customer endpoints are down"]
  expected_actions: [rollback_deploy, restart_pods]
  red_herrings:
    - "consumer lag is large and growing, but it is the consequence of failed deliveries, not the cause"
    - "the deploy was a day earlier, so the change is easy to overlook when only checking the last hour"
